services:
  postgres:
    container_name: postgres
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: bogdao_tech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5434:5432"

    volumes:
      - postgres18-data:/var/lib/postgresql

volumes:
  postgres18-data: 
  