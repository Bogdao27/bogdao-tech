services:
  postgres:
    container_name: postgres
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: bogdao_tech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5434:5432"

    volumes:
      - postgres18-data:/var/lib/postgresql

  seq:
    image: datalust/seq:latest
    container_name: seq
    restart: always
    environment:
     - ACCEPT_EULA=Y
     - SEQ_FIRSTRUN_ADMINPASSWORD
    ports:
     - 5341:5341
     - 8081:80
  
  bogdaotech.api:
    build:
      context: .
      dockerfile: src/BogdaoTech.API/Dockerfile

volumes:
  postgres18-data: 
  